name: Build and deploy Docker app

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Pull, build, and restart the container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || 'ec2-3-110-118-65.ap-south-1.compute.amazonaws.com' }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "::error::EC2_HOST is empty. Set the EC2_HOST repository secret."
            exit 1
          fi
          if [ -z "$EC2_USER" ]; then
            echo "::error::EC2_USER is empty. Set the EC2_USER repository secret."
            exit 1
          fi
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" <<'REMOTE_SCRIPT'
            set -e
            cd ~/nodejs-application-deploy-github-actions
            git pull origin main
            docker build -t taskflow-pro .
            docker rm -f nodejscicd 2>/dev/null || true
            docker run -d --name nodejscicd -p 8080:8080 taskflow-pro
            docker ps --filter name=nodejscicd --filter status=running
            curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8080/
          REMOTE_SCRIPT