name: Build and deploy Docker app

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$EC2_SSH_KEY" > /tmp/ec2-key.pem
          chmod 600 /tmp/ec2-key.pem

      - name: Pull, build, and restart the container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "::error::EC2_HOST is missing"
            exit 1
          fi

          if [ -z "$EC2_USER" ]; then
            echo "::error::EC2_USER is missing"
            exit 1
          fi

          ssh -i /tmp/ec2-key.pem \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=no \
            "$EC2_USER@$EC2_HOST" <<'REMOTE_SCRIPT'

            set -e

            cd ~/nodejs-application-deploy-github-actions

            echo "Pulling latest code..."
            git pull origin main

            echo "Building Docker image..."
            docker build -t taskflow-pro .

            echo "Removing old container..."
            docker rm -f nodejscicd 2>/dev/null || true

            echo "Starting new container..."
            docker run -d \
              --name nodejscicd \
              -p 8080:8080 \
              taskflow-pro

            echo "Checking container..."
            docker ps --filter name=nodejscicd --filter status=running

            echo "Testing application..."
            curl --fail --retry 5 --retry-delay 2 \
              http://127.0.0.1:8080/

          REMOTE_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f /tmp/ec2-key.pem